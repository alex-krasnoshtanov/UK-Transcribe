[project]
name = "uk-transcribe"
version = "0.1.0"
description = "Self-hosted Ukrainian lecture transcription (faster-whisper + web UI)"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies. torch is intentionally absent: the CUDA check uses
# ctranslate2 (faster-whisper's own backend), so torch would be gigabytes of
# dead weight. nvidia-ml-py is only used to pick the emptiest GPU at startup.
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-ml-py>=12.0.0",
]

# Web UI. Optional so a bare CLI/debug install stays lean; the web deps come in
# with `uv sync --extra app`. The Docker image always installs them (via
# requirements.txt) since one image serves the whole product.
[project.optional-dependencies]
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

# yt-dlp is used only to source/prepare test audio, never at runtime, so it is a
# dev-tooling group rather than a project dependency. uv installs this group by
# default on `uv sync`; the Docker image never gets it (built from requirements.txt).
[dependency-groups]
dev = [
    "yt-dlp>=2026.7.4",
]
