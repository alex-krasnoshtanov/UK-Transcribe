<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uk-transcribe</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #2563eb;
      --border: #8883;
      --error: #c0392b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.lead { margin-top: 0; opacity: 0.8; }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1rem;
    }
    input[type="file"] { display: block; margin-bottom: 1rem; max-width: 100%; }
    button {
      font: inherit;
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .progress {
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 1.25rem;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    #statusText { margin-top: 0.75rem; min-height: 1.5rem; }
    a.download {
      display: inline-block;
      margin-top: 1rem;
      color: var(--accent);
    }
    .error { color: var(--error); }
  </style>
</head>
<body>
  <h1>Ukrainian lecture transcription</h1>
  <p class="lead">Upload an audio or video file. It is transcribed on the server
     and returned as a downloadable Ukrainian text file.</p>

  <div class="card">
    <input type="file" id="file" accept="audio/*,video/*">
    <button id="upload" disabled>Transcribe</button>

    <div class="progress" id="progress" hidden>
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div id="statusText"></div>
  </div>

  <script>
    const fileInput = document.getElementById("file");
    const uploadBtn = document.getElementById("upload");
    const statusText = document.getElementById("statusText");
    const progress = document.getElementById("progress");
    const progressFill = document.getElementById("progressFill");

    // Single active poll timer. Poll /status every second: job states are
    // coarse and low-frequency, so polling beats websockets here - fewer moving
    // parts for no real downside at single-user scale.
    let pollTimer = null;

    fileInput.addEventListener("change", () => {
      uploadBtn.disabled = !fileInput.files.length;
    });

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      setBusy(true);
      resetProgress();
      setStatus("Uploading...");

      const form = new FormData();
      form.append("file", file);

      try {
        const res = await fetch("/upload", { method: "POST", body: form });
        if (!res.ok) throw new Error("upload failed (" + res.status + ")");
        const { job_id } = await res.json();
        poll(job_id);
      } catch (err) {
        showError(err.message);
        setBusy(false);
      }
    });

    function poll(jobId) {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch("/status/" + jobId);
          if (!res.ok) throw new Error("status check failed");
          const data = await res.json();
          render(data, jobId);
        } catch (err) {
          clearInterval(pollTimer);
          showError(err.message);
          setBusy(false);
        }
      }, 1000);
    }

    function render(data, jobId) {
      const pct = Math.round((data.progress || 0) * 100);

      if (data.status === "pending") {
        setStatus("Queued...");
      } else if (data.status === "processing") {
        progress.hidden = false;
        progressFill.style.width = pct + "%";
        setStatus("Transcribing... " + pct + "%");
      } else if (data.status === "done") {
        clearInterval(pollTimer);
        progress.hidden = false;
        progressFill.style.width = "100%";
        showDownload(jobId);
        setBusy(false);
      } else if (data.status === "error") {
        clearInterval(pollTimer);
        showError(data.detail || "transcription failed");
        setBusy(false);
      }
    }

    function showDownload(jobId) {
      setStatus("Done.");
      const link = document.createElement("a");
      link.href = "/download/" + jobId;
      link.textContent = "Download transcript";
      link.className = "download";
      statusText.appendChild(link);
    }

    function showError(msg) {
      progress.hidden = true;
      statusText.innerHTML = '<span class="error">Error: ' + msg + "</span>";
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function resetProgress() {
      progress.hidden = true;
      progressFill.style.width = "0%";
    }

    function setBusy(busy) {
      uploadBtn.disabled = busy || !fileInput.files.length;
      fileInput.disabled = busy;
    }
  </script>
</body>
</html>
