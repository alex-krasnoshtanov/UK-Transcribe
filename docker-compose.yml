# Local / desktop run (e.g. the RTX 5070 PC): API + dashboard on http://localhost:3000.
#
#   docker compose up --build
#
# This file is NOT for the student cluster: there the GPU is a memory slice
# (BUAS_GPU_MEMORY) and a whole-device reservation like the one below would
# take a full shared card. The cluster stack is deploy/cluster.yml.
services:
  ukt-api:
    build: .
    image: ${API_IMAGE:-uk-transcribe:local}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      DEVICE: ${DEVICE:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - data:/data
      - models:/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ukt-web:
    build: ./web
    image: ${WEB_IMAGE:-uk-transcribe-web:local}
    environment:
      API_URL: http://ukt-api:8000
    ports:
      - "${PORT:-3000}:8000"
    depends_on:
      - ukt-api
    restart: unless-stopped

volumes:
  data:
  models:
